name: Validate VAT and funded capital
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vat-financing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check invoice VAT and capital settlement
        run: node --test tests/vat-financing.test.mjs
