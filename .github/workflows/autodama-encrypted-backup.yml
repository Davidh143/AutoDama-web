name: AutoDama – encrypted off-site backup

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-backup:
    name: Application data + referenced documents
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUTODAMA_BACKUP_KEY: ${{ secrets.AUTODAMA_BACKUP_KEY }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo 'Missing SUPABASE_URL secret'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Missing SUPABASE_SERVICE_ROLE_KEY secret'; exit 1; }
          test -n "$AUTODAMA_BACKUP_KEY" || { echo 'Missing AUTODAMA_BACKUP_KEY secret'; exit 1; }
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography
        run: python -m pip install 'cryptography>=44,<47'
      - name: Verify encryption
        run: python scripts/autodama_encrypted_backup.py --self-test
      - name: Create encrypted archive
        run: |
          python scripts/autodama_encrypted_backup.py \
            --output "autodama-$(date -u +'%Y%m%d').adbackup"
      - name: Keep encrypted off-site backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: autodama-encrypted-${{ github.run_id }}
          path: '*.adbackup'
          if-no-files-found: error
          retention-days: 30
